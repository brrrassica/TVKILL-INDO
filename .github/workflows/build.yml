name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble and test
        run: ./gradlew --no-daemon clean assembleDebug testDebugUnitTest lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tvkillindo-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # The JDK version is part of the reproducibility contract: do not change it
  # without regenerating the reference APK hash for the release tag.
  reproducible-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build release APK (first)
        run: ./gradlew --no-daemon clean assembleRelease && sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/apk1.sha
      - name: Build release APK (second)
        run: ./gradlew --no-daemon clean assembleRelease && sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/apk2.sha
      - name: Compare builds
        run: diff /tmp/apk1.sha /tmp/apk2.sha
