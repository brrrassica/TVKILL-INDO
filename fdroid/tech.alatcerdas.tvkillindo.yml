Summary: Turn off TVs with an Android phone's IR blaster
Description: |
  TVKILL-INDO transmits IR power-off patterns through a phone's built-in
  infrared blaster. It is a GPLv3 fork of TV KILL, updated for current Android
  versions and for TV brands commonly sold in Indonesia.

  Requires an Android device with an IR blaster. Works offline: no accounts,
  analytics, ads or network access.

